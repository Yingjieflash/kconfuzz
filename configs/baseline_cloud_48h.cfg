{
	"name": "baseline-cloud-48h-clang18",
	"target": "linux/amd64",
	"http": "127.0.0.1:56741",
	"rpc": "127.0.0.1:0",
	"workdir": "/path/to/kconfuzz/workdirs/baseline_cloud_48h",
	"kernel_obj": "/path/to/linux-6.12.80-clang18-fuzz",
	"kernel_src": "/path/to/linux-6.12.80-clang18-fuzz",
	"image": "/path/to/vmimg/bookworm.img",
	"sshkey": "/path/to/vmimg/bookworm.id_rsa",
	"ssh_user": "root",
	"syzkaller": "/path/to/kconfuzz",
	"procs": 4,
	"reproduce": false,
	"fuzzing_vms": 8,
	"preserve_corpus": true,
	"max_crash_logs": 20,
	"raw_cover": false,
	"sandbox": "namespace",
	"cover": true,
	"type": "qemu",
	"vm": {
		"count": 8,
		"cpu": 2,
		"mem": 4096,
		"kernel": "/path/to/linux-6.12.80-clang18-fuzz/arch/x86/boot/bzImage",
		"cmdline": "console=ttyS0 root=/dev/sda earlyprintk=serial net.ifnames=0 nokaslr",
		"snapshot": true,
		"qemu_args": "-enable-kvm"
	}
}
